<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIREA | Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body>
<header>
    <div class="logo">MIREA</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="cart">🛒 <span id="cart-count">0</span></div>
</header>

<section class="page-banner shop-banner">
    <h1>Our Collection</h1>
    <p>Premium minimalist fashion</p>
</section>

<section class="shop-section">
    <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">

    <div class="product-grid" id="products">
        <div class="product-card product-item">
            <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=800&q=80">
            <h3>Elegant Coat</h3>
            <p>1299 MDL</p>
            <button onclick="addToCart('Elegant Coat',1299)">Add to Cart</button>
        </div>

        <div class="product-card product-item">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80">
            <h3>Minimal Dress</h3>
            <p>999 MDL</p>
            <button onclick="addToCart('Minimal Dress',999)">Add to Cart</button>
        </div>

        <div class="product-card product-item">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80">
            <h3>Urban Jacket</h3>
            <p>1199 MDL</p>
            <button onclick="addToCart('Urban Jacket',1199)">Add to Cart</button>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 MIREA Official Store</p>
</footer>
</body>
</html>
