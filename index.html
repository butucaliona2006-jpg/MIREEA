<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIREA | Home</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>
<body>
<header>

    <nav>

        <a href="contact.html">Contact</a>

        <div class="product-card">
            <img src="images/product2.jpg" alt="Produs">

            <button onclick="addToCart('Minimal Dress',699)">Adaugă în coș</button>

    <p>© 2026 MIREA Fashion Store</p>
</footer>
